<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RD3 - Espor Slot Alma</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
        body { background-color: #0f1117; color: #ffffff; padding: 20px; display: flex; justify-content: center; min-height: 100vh; }
        .container { width: 100%; max-width: 500px; background: #1a1d24; border-radius: 12px; padding: 25px; }
        h1 { text-align: center; color: #ff4655; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 6px; font-size: 14px; }
        input, select { width: 100%; padding: 12px; background: #0f1117; border: 1px solid #30363d; border-radius: 6px; color: #fff; }
        button { width: 100%; padding: 14px; background-color: #ff4655; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        .slot-list { margin-top: 25px; border-top: 1px solid #2a2e39; padding-top: 15px; }
        .slot-item { display: flex; justify-content: space-between; background: #0f1117; padding: 10px; border-radius: 6px; margin-bottom: 8px; }
    </style>
</head>
<body>

<div class="container">
    <h1>RD3 ESPOR SLOT ALMA</h1>

    <form id="slotForm">
        <div class="form-group">
            <label>Takım Adı:</label>
            <input type="text" id="teamName" placeholder="Takım adı girin" required>
        </div>

        <div class="form-group">
            <label>Kaptan Discord / İletişim:</label>
            <input type="text" id="captainContact" placeholder="İletişim adresi" required>
        </div>

        <div class="form-group">
            <label>Slot Seçin:</label>
            <select id="slotSelect" required></select>
        </div>

        <button type="submit">Slotu Rezerve Et</button>
    </form>

    <div class="slot-list">
        <h3>Slot Durumu</h3>
        <div id="slotsContainer"></div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
